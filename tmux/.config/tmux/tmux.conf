# Use default shell and style
set-option -g default-shell "$SHELL"
set-option -g focus-events on

# enable links
set -g allow-passthrough all
set -ga terminal-features ",*:hyperlinks"

set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u

# Snappiness
set-option -sg escape-time 10

# history
set-option -g history-limit 5000

# Change prefix
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# PANES

# Sync panes
bind a set-window-option synchronize-panes

# Arrows movement
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# fast window select
bind -n C-M-Left select-window -p
bind -n C-M-Right select-window -n


# better split panes
bind v split-window -h
bind h split-window -v
unbind '"'
unbind %

# SESSIONS
bind -n M-S-Right switch-client -n
bind -n M-S-Left switch-client -p

# Utils

# copy last command output
bind -n C-y send-keys '!! | pbcopy' Enter

#### COLOUR (Solarized 256)

# follow terminal colors
set -g theme detect
set-option -gq status-style "bg=default,fg=default"
set-option -gq status-left-style "bg=default,fg=default"
set-option -gq status-right-style "bg=default,fg=default"
set-option -gq window-status-style "bg=default,fg=default"
set-option -gq window-status-current-style "bg=default,fg=default,bold"
set-option -gq message-style "fill=themeyellow,bg=themeyellow,fg=themeblack"
set-option -gq message-command-style "fill=themeyellow,bg=themeyellow,fg=themeblack"
set-option -gq mode-style "bg=default,fg=default,reverse"
set-option -gq pane-border-style "fg=default"
set-option -gq pane-active-border-style "fg=default"

# active pane borders
set -g pane-border-style "fg=themeblack"
set -g pane-active-border-style "fg=themecyan,bg=default"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " ● #{pane_title} "

# status active window background rounded highlight
setw -g window-status-current-format '#[fg=themegreen bg=default]#[fg=themeblack bg=themegreen]#I #W #F#[fg=themegreen bg=default]'

# Enable mouse control (clickable windows, panes, resizable panes)
# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# extend session name max chars
set -g status-left-length 64
